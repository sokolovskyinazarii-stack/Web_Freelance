<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreelanceHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <circle cx="7.5" cy="8.5" r="3.2" fill="currentColor"/>
          <circle cx="24.5" cy="9.5" r="3.2" fill="currentColor"/>
          <circle cx="16" cy="24.5" r="3.2" fill="currentColor"/>
          <path d="M10.2 10.6 13.8 20.8M21.8 12.2 18.2 21.2M10.6 8.7 21.4 9.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">FreelanceHub</span>
    </a>

    <button class="menu-toggle" id="menu-toggle" aria-label="Меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav" id="nav" aria-label="Головна навігація"></nav>
  </header>

  <main class="main">
    <div class="view" id="view"></div>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
